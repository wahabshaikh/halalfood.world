name: Preview

# Every same-repository pull request gets its own preview Worker version at
# https://pr-<n>-halalfood-world.<subdomain>.workers.dev, backed by its own D1
# database and the shared preview R2 bucket. Fork pull requests
# and Dependabot pull requests are skipped because they have no access to
# deployment secrets. See docs/cloudflare.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.setup.outputs.preview_url }}
    outputs:
      preview_url: ${{ steps.setup.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create preview D1 database and rebind resources
        id: setup
        working-directory: apps/web
        run: node scripts/preview.mjs setup

      - name: Apply migrations to the preview database
        working-directory: apps/web
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Seed the preview database
        working-directory: apps/web
        run: |
          if [ -f seed/places.sql ]; then
            npx wrangler d1 execute DB --remote --config dist/server/wrangler.json --file seed/places.sql
          else
            echo "No seed/places.sql on this branch; skipping"
          fi

      - name: Upload preview version
        working-directory: apps/web
        env:
          PREVIEW_URL: ${{ steps.setup.outputs.preview_url }}
          PREVIEW_ALIAS: ${{ steps.setup.outputs.alias }}
          VERSION_MESSAGE: ${{ steps.setup.outputs.version_message }}
        run: |
          npx wrangler versions upload \
            --config dist/server/wrangler.json \
            --preview-alias "$PREVIEW_ALIAS" \
            --var "BETTER_AUTH_URL:$PREVIEW_URL" \
            --message "$VERSION_MESSAGE"

      - name: Comment the preview URL
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.setup.outputs.preview_url }}
          D1_NAME: ${{ steps.setup.outputs.d1_name }}
        with:
          script: |
            const marker = "<!-- halalfood-world-preview -->";
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              "",
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. ` +
                `Database \`${process.env.D1_NAME}\` (migrations applied, no production data).`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  e2e:
    name: End-to-end tests on the preview
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check for a Playwright suite
        id: suite
        run: |
          if ls apps/web/playwright.config.* >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Playwright config on this branch; skipping"
          fi

      - uses: actions/setup-node@v6
        if: steps.suite.outputs.present == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - if: steps.suite.outputs.present == 'true'
        run: npm ci

      - name: Run Playwright against the preview
        if: steps.suite.outputs.present == 'true'
        working-directory: apps/web
        env:
          TEST_BASE_URL: ${{ needs.deploy.outputs.preview_url }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure() && steps.suite.outputs.present == 'true'
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: apps/web/playwright-report
          retention-days: 7

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Delete preview versions and D1 database
        working-directory: apps/web
        run: node scripts/preview.mjs cleanup
