version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*", "vinext", "@vinext/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "react-server-dom-webpack"]
      lint-and-test:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "vitest", "@vitest/*", "@playwright/test", "prettier"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
