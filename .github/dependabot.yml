version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*", "vinext", "@vinext/*"]
      react:
        patterns: ["react", "react-dom", "react-server-dom-webpack", "@types/react", "@types/react-dom"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
