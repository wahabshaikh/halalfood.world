<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; }
    .c { font-family: "Karla", system-ui, sans-serif; color: #141F1E; -webkit-font-smoothing: antialiased; }
    .c-d { font-family: "Syne", system-ui, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
    .c-num { font-variant-numeric: tabular-nums; font-family: "Syne", sans-serif; font-weight: 800; }
    .c-lbl { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; color: #0E6F66; }
    .c-screen { width: 390px; height: 844px; background: #FBF6EC; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .c-card { background: #FFFFFF; border: 2px solid #141F1E; border-radius: 10px; box-shadow: 3px 3px 0 #141F1E; }
    .c-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; flex-shrink: 0; }
    .c-icobtn { width: 44px; height: 44px; border-radius: 10px; background: #FFFFFF; border: 2px solid #141F1E; display: grid; place-items: center; box-shadow: 2px 2px 0 #141F1E; }
    .c-cta { height: 54px; border-radius: 10px; background: #0E6F66; color: #FBF6EC; border: 2px solid #141F1E; box-shadow: 3px 3px 0 #141F1E; display: flex; align-items: center; justify-content: center; gap: 9px; font-family: "Syne", sans-serif; font-size: 16px; font-weight: 800; }
    .c-nav { position: absolute; left: 18px; right: 18px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); height: 62px; border-radius: 999px; background: #141F1E; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 6px; }
    .c-navi { display: grid; place-items: center; min-height: 44px; border-radius: 999px; }
    .c-navi.on { background: #F0A319; }
    a { color: #0E6F66; text-decoration: none; font-weight: 600; }
    a:hover { color: #0B564F; }
  </style>
</helmet>
<div class="c c-screen">

  <div class="c-top">
    <div class="c-d" style="font-size: 27px;">Collections</div>
    <div class="c-icobtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141F1E" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 2px 18px 0;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 11px;">
      <div style="height: 126px; border: 2px solid #141F1E; border-radius: 10px; box-shadow: 3px 3px 0 #141F1E; background: #0E6F66; padding: 13px 14px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;">
        <div style="position: absolute; right: -16px; bottom: -16px; opacity: .2;"><svg width="80" height="80" viewBox="0 0 24 24" fill="#FBF6EC"><path d="M12 1.5 14.6 7l5.9.5-4.5 3.9 1.4 5.8L12 14.1 6.6 17.2 8 11.4 3.5 7.5 9.4 7Z"/></svg></div>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F0A319" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="position: relative;"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>
        <div style="position: relative;">
          <div class="c-d" style="font-size: 16px; color: #FBF6EC;">Want to try</div>
          <div style="font-size: 11px; color: #BEE3DF; margin-top: 3px;"><span class="c-num" style="font-size: 11px;">14</span> places</div>
        </div>
      </div>

      <div style="height: 126px; border: 2px solid #141F1E; border-radius: 10px; box-shadow: 3px 3px 0 #141F1E; background: #F0A319; padding: 13px 14px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#141F1E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 0 0 8 4 4 0 0 1 0 8"/><path d="M5 21h14"/></svg>
        <div>
          <div class="c-d" style="font-size: 16px;">Iftar 2027</div>
          <div style="font-size: 11px; color: #7A5A10; margin-top: 3px;"><span class="c-num" style="font-size: 11px;">9</span> places · shared</div>
        </div>
      </div>

      <div style="height: 126px; border: 2px solid #141F1E; border-radius: 10px; box-shadow: 3px 3px 0 #141F1E; background: #C4553B; padding: 13px 14px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FBF6EC" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20h14M7 20V9l5-4 5 4v11"/><path d="M10 20v-5h4v5"/></svg>
        <div>
          <div class="c-d" style="font-size: 16px; color: #FBF6EC;">Biryani hunt</div>
          <div style="font-size: 11px; color: #F2CFC6; margin-top: 3px;"><span class="c-num" style="font-size: 11px;">6</span> places</div>
        </div>
      </div>

      <div style="height: 126px; border: 2px dashed #141F1E; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#141F1E" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <div class="c-d" style="font-size: 13px;">New</div>
      </div>
    </div>

    <!-- city passports -->
    <div class="c-lbl" style="margin: 22px 0 11px;">City passports</div>
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; border: 2px solid #141F1E; border-radius: 10px; box-shadow: 3px 3px 0 #141F1E; background: #FFFFFF; padding: 12px 13px;">
        <div class="c-d" style="font-size: 14px;">Birmingham</div>
        <div style="display: flex; gap: 3px; margin-top: 9px; flex-wrap: wrap;">
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #0E6F66;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #0E6F66;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #0E6F66;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #0E6F66;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #0E6F66;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
        </div>
        <div class="c-num" style="font-size: 12px; margin-top: 9px; color: #0E6F66;">18 / 40 stamps</div>
      </div>
      <div style="flex: 1; border: 2px solid #141F1E; border-radius: 10px; box-shadow: 3px 3px 0 #141F1E; background: #FFFFFF; padding: 12px 13px;">
        <div class="c-d" style="font-size: 14px;">Manchester</div>
        <div style="display: flex; gap: 3px; margin-top: 9px; flex-wrap: wrap;">
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #0E6F66;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #0E6F66;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
          <span style="width: 13px; height: 13px; border-radius: 3px; background: #E6DECE;"></span>
        </div>
        <div class="c-num" style="font-size: 12px; margin-top: 9px; color: #8D9C95;">4 / 40 stamps</div>
      </div>
    </div>

    <div class="c-lbl" style="margin: 22px 0 11px;">Collections to follow</div>

    <div class="c-card" style="padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 8px; background: #0E6F66; border: 2px solid #141F1E; display: grid; place-items: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#F0A319"><path d="M12 1.5 14.6 7l5.9.5-4.5 3.9 1.4 5.8L12 14.1 6.6 17.2 8 11.4 3.5 7.5 9.4 7Z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 14px; font-weight: 700;">Every zabiha spot on Coventry Rd</div>
        <div style="font-size: 11px; color: #5C6B66; margin-top: 3px;">Yusuf R. · <span class="c-num" style="font-size: 11px;">31</span> places</div>
      </div>
      <div style="height: 30px; padding: 0 12px; border-radius: 7px; background: #F0A319; border: 2px solid #141F1E; font-size: 12px; font-weight: 700; display: flex; align-items: center;">Follow</div>
    </div>

    <div class="c-card" style="margin-top: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 8px; background: #C4553B; border: 2px solid #141F1E; display: grid; place-items: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#FBF6EC"><path d="M12 1.5 14.6 7l5.9.5-4.5 3.9 1.4 5.8L12 14.1 6.6 17.2 8 11.4 3.5 7.5 9.4 7Z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 14px; font-weight: 700;">Late-night after Isha</div>
        <div style="font-size: 11px; color: #5C6B66; margin-top: 3px;">Fatima N. · <span class="c-num" style="font-size: 11px;">18</span> places</div>
      </div>
      <div style="height: 30px; padding: 0 12px; border-radius: 7px; background: #FFFFFF; border: 2px solid #141F1E; font-size: 12px; font-weight: 700; display: flex; align-items: center;">Follow</div>
    </div>

  </div>

  <div style="height: 94px; flex-shrink: 0;"></div>
  <div class="c-nav">
    <div class="c-navi "><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8D9C95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3Z"/><path d="M9 4v13M15 7v13"/></svg></div>
    <div class="c-navi on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#141F1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></div>
    <div class="c-navi"><div style="width: 44px; height: 44px; border-radius: 50%; background: #F0A319; display: grid; place-items: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#141F1E" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div></div>
    <div class="c-navi "><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8D9C95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V11M12 21V4M19 21v-6"/></svg></div>
    <div class="c-navi "><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8D9C95" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.4 7.4 0 0 1 14.4 0"/></svg></div>
  </div>
</div>
</x-dc>
</body>
</html>
