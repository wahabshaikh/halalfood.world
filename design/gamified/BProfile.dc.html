<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .b { font-family: "Space Grotesk", system-ui, sans-serif; color: #F1F5EF; -webkit-font-smoothing: antialiased; }
    .b-d { font-family: "Archivo", system-ui, sans-serif; font-weight: 800; letter-spacing: -0.035em; }
    .b-num { font-variant-numeric: tabular-nums; font-family: "Archivo", system-ui, sans-serif; font-weight: 800; letter-spacing: -0.04em; }
    .b-lbl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #7E8C84; }
    .b-screen { width: 390px; height: 844px; background: #0B100E; overflow: hidden; display: flex; flex-direction: column; }
    .b-card { background: #161D19; border: 1px solid #262F2A; border-radius: 18px; }
    .b-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; flex-shrink: 0; }
    .b-icobtn { width: 44px; height: 44px; border-radius: 12px; background: #161D19; border: 1px solid #262F2A; display: grid; place-items: center; }
    .b-cta { height: 54px; border-radius: 15px; background: #FFB347; color: #10170F; display: flex; align-items: center; justify-content: center; gap: 9px; font-family: "Archivo", sans-serif; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; box-shadow: 0 0 28px #FFB34733; }
    .b-tabbar { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: #0E1412; border-top: 1px solid #212A25; padding: 10px 8px calc(11px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; }
    .b-tab { display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px; justify-content: center; }
    .b-tab span { font-size: 10px; font-weight: 600; color: #7E8C84; }
    .b-tab.on span { color: #FFB347; font-weight: 700; }
    a { color: #FFB347; text-decoration: none; }
    a:hover { color: #FFC978; }
  </style>
</helmet>
<div class="b b-screen">

  <div class="b-top">
    <div style="font-size: 13px; font-weight: 700; color: #8A978F;">Profile</div>
    <div class="b-icobtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F1F5EF" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg></div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 18px;">

    <div style="text-align: center; padding: 6px 0 0;">
      <div style="width: 88px; height: 88px; margin: 0 auto; border-radius: 50%; background: linear-gradient(150deg, #FFB347, #FF6B4A); padding: 3px; box-shadow: 0 0 40px #FFB34733;">
        <div style="width: 100%; height: 100%; border-radius: 50%; background: #0B100E; display: grid; place-items: center;">
          <span class="b-d" style="font-size: 27px; color: #FFB347;">AK</span>
        </div>
      </div>
      <div class="b-d" style="font-size: 24px; margin-top: 12px;">Aisha K.</div>
      <div style="display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; height: 28px; padding: 0 12px; border-radius: 999px; background: #241A10; border: 1px solid #4A3316;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#FFB347"><path d="M12 2.5 4.5 6v5.6c0 4.6 3.2 8.5 7.5 9.9 4.3-1.4 7.5-5.3 7.5-9.9V6Z"/></svg>
        <span style="font-size: 11.5px; font-weight: 700; color: #FFB347; letter-spacing: 0.06em;">SCOUT · BIRMINGHAM</span>
      </div>
    </div>

    <!-- stat trio -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 18px;">
      <div class="b-card" style="padding: 14px 8px; text-align: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#FF8A3D"><path d="M13 2c.4 4-2.6 5.2-3.8 7.4-1 1.8.3 3.3 1.3 3.1 1-.2.6-2 1.7-2.9 1.4 3.4 4.3 3.9 4.3 7.2A5.5 5.5 0 0 1 6 17.6C6 11.4 12.3 9.9 13 2Z"/></svg>
        <div class="b-num" style="font-size: 22px; margin-top: 6px;">6</div>
        <div style="font-size: 9.5px; color: #7E8C84; margin-top: 3px; letter-spacing: 0.08em;">WEEK STREAK</div>
      </div>
      <div class="b-card" style="padding: 14px 8px; text-align: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#6FE3A5"><path d="M13.5 2 4 13.5h6L9.5 22 20 10h-6.8Z"/></svg>
        <div class="b-num" style="font-size: 22px; margin-top: 6px; color: #6FE3A5;">1,092</div>
        <div style="font-size: 9.5px; color: #7E8C84; margin-top: 3px; letter-spacing: 0.08em;">XP SEASON</div>
      </div>
      <div class="b-card" style="padding: 14px 8px; text-align: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFB347" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M10 20h4M12 13v7"/></svg>
        <div class="b-num" style="font-size: 22px; margin-top: 6px; color: #FFB347;">7th</div>
        <div style="font-size: 9.5px; color: #7E8C84; margin-top: 3px; letter-spacing: 0.08em;">AMBER</div>
      </div>
    </div>

    <!-- next rank -->
    <div class="b-card" style="margin-top: 10px; padding: 15px 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span class="b-lbl">Next rank</span>
        <span class="b-num" style="font-size: 12px; color: #FFB347;">708 to go</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; margin-top: 11px;">
        <span class="b-d" style="font-size: 13px; color: #8A978F;">Scout</span>
        <div style="flex: 1; height: 8px; border-radius: 4px; background: #232C27; overflow: hidden;">
          <div style="width: 61%; height: 8px; background: linear-gradient(90deg, #6FE3A5, #FFB347);"></div>
        </div>
        <span class="b-d" style="font-size: 13px;">Guide</span>
      </div>
    </div>

    <!-- badges -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin: 20px 0 11px;">
      <div class="b-lbl">Badges</div>
      <div class="b-num" style="font-size: 12px; color: #FFB347;">7 / 24</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
      <div style="text-align: center;">
        <div style="aspect-ratio: 1; border-radius: 18px; background: linear-gradient(150deg, #123026, #101815); border: 1px solid #1E4636; display: grid; place-items: center; box-shadow: 0 0 20px #6FE3A518;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FE3A5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="m9.5 14 1.8 1.8 3.4-3.6"/></svg>
        </div>
        <div style="font-size: 9px; font-weight: 700; margin-top: 7px; color: #B3BFB8; line-height: 1.3;">First proof</div>
      </div>
      <div style="text-align: center;">
        <div style="aspect-ratio: 1; border-radius: 18px; background: linear-gradient(150deg, #33240F, #171C18); border: 1px solid #4A3316; display: grid; place-items: center; box-shadow: 0 0 20px #FFB34718;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB347" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v6c0 4.4 3.4 7.6 8 8.6 4.6-1 8-4.2 8-8.6V7Z"/><path d="m9 12 2 2 4-4.4"/></svg>
        </div>
        <div style="font-size: 9px; font-weight: 700; margin-top: 7px; color: #B3BFB8; line-height: 1.3;">10 verified</div>
      </div>
      <div style="text-align: center;">
        <div style="aspect-ratio: 1; border-radius: 18px; background: linear-gradient(150deg, #2A1A16, #171C18); border: 1px solid #4A241B; display: grid; place-items: center; box-shadow: 0 0 20px #FF6B4A18;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B4A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c4.5-3.4 7-7 7-10.6A7 7 0 0 0 5 10.4C5 14 7.5 17.6 12 21Z"/><path d="M12 7v4.4M9.6 9.2h4.8"/></svg>
        </div>
        <div style="font-size: 9px; font-weight: 700; margin-top: 7px; color: #B3BFB8; line-height: 1.3;">New street</div>
      </div>
      <div style="text-align: center; opacity: .4;">
        <div style="aspect-ratio: 1; border-radius: 18px; background: #131A16; border: 1px dashed #3A4A42; display: grid; place-items: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7E8C84" stroke-width="1.9" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
        </div>
        <div style="font-size: 9px; font-weight: 700; margin-top: 7px; color: #7E8C84; line-height: 1.3;">Muhtasib</div>
      </div>
    </div>

    <!-- contributions -->
    <div class="b-lbl" style="margin: 20px 0 10px;">All time</div>
    <div style="display: flex; gap: 9px;">
      <div class="b-card" style="flex: 1; padding: 12px 13px;">
        <div class="b-num" style="font-size: 19px;">9</div>
        <div style="font-size: 10px; color: #7E8C84; margin-top: 3px;">places added</div>
      </div>
      <div class="b-card" style="flex: 1; padding: 12px 13px;">
        <div class="b-num" style="font-size: 19px;">11</div>
        <div style="font-size: 10px; color: #7E8C84; margin-top: 3px;">proofs accepted</div>
      </div>
      <div class="b-card" style="flex: 1; padding: 12px 13px;">
        <div class="b-num" style="font-size: 19px;">38</div>
        <div style="font-size: 10px; color: #7E8C84; margin-top: 3px;">ratings</div>
      </div>
      <div class="b-card" style="flex: 1; padding: 12px 13px;">
        <div class="b-num" style="font-size: 19px;">62</div>
        <div style="font-size: 10px; color: #7E8C84; margin-top: 3px;">photos</div>
      </div>
    </div>

  </div>

  <div class="b-tabbar">
    <div class="b-tab"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7E8C84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 3v13l6-3 6 3 6-3V4l-6 3-6-3Z"/><path d="M9 4v13M15 7v13"/></svg><span>Tonight</span></div>
    <div class="b-tab"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7E8C84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg><span>Saved</span></div>
    <div class="b-tab"><div style="width: 40px; height: 32px; border-radius: 11px; background: #FFB347; display: grid; place-items: center; box-shadow: 0 0 22px #FFB34740;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10170F" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div><span>Add</span></div>
    <div class="b-tab"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7E8C84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M10 20h4M12 13v7"/></svg><span>League</span></div>
    <div class="b-tab on"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFB347" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.4 7.4 0 0 1 14.4 0"/></svg><span>You</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
